[project]
name = "superstore-sales-forecast"
version = "0.1.0"
description = "Interactive Superstore sales forecasting dashboard"
requires-python = ">=3.11"
dependencies = [
    "dash>=2.14.0",
    "dash-bootstrap-components>=1.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
]

[tool.vercel]
entrypoint = "app:app"
